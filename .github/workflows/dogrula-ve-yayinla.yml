name: JSON Doğrula ve CDN Temizle

# Her push'ta çalışır. İki iş yapar:
#  1. JSON dosyaları geçerli mi kontrol eder — bozuksa hata verir.
#  2. jsDelivr CDN önbelleğini temizler — yoksa değişiklik 12 saat görünmez.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dogrula:
    name: JSON geçerlilik kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON sözdizimi ve zorunlu alan kontrolü
        run: |
          python3 - <<'PY'
          import json, sys, re, glob, os

          hata = []

          def kontrol_tarih(deger, yer):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", deger or ""):
                  hata.append(f"{yer}: tarih 'YYYY-MM-DD' olmali, gelen: '{deger}'")

          # --- takvim.json ---
          if os.path.exists("takvim.json"):
              with open("takvim.json", encoding="utf-8") as f:
                  try:
                      t = json.load(f)
                  except json.JSONDecodeError as e:
                      print(f"HATA: takvim.json bozuk JSON -> {e}")
                      sys.exit(1)

              KURUM = {"AUZEF", "ANADOLU", "ATA", "ANKUZEF", "SEGEM", "DIGER"}
              TIP   = {"VIZE","FINAL","BUTUNLEME","UCDERS","BASVURU","DUYURU"}
              DURUM = {"kesinlesti", "tahmini"}

              idler = set()
              for i, k in enumerate(t.get("kayitlar", [])):
                  yer = f"takvim.json kayit[{i}] (id={k.get('id','YOK')})"
                  for alan in ("id","kurum","baslik","baslangic","durum","tip"):
                      if not k.get(alan):
                          hata.append(f"{yer}: '{alan}' zorunlu ve bos olamaz")
                  if k.get("id") in idler:
                      hata.append(f"{yer}: id tekrar ediyor")
                  idler.add(k.get("id"))
                  if k.get("kurum") not in KURUM:
                      hata.append(f"{yer}: kurum '{k.get('kurum')}' gecersiz. Gecerli: {sorted(KURUM)}")
                  if k.get("tip") not in TIP:
                      hata.append(f"{yer}: tip '{k.get('tip')}' gecersiz. Gecerli: {sorted(TIP)}")
                  if k.get("durum") not in DURUM:
                      hata.append(f"{yer}: durum '{k.get('durum')}' gecersiz. Gecerli: {sorted(DURUM)}")
                  kontrol_tarih(k.get("baslangic"), yer + " baslangic")
                  if k.get("bitis"):
                      kontrol_tarih(k.get("bitis"), yer + " bitis")
                      if k.get("baslangic") and k["bitis"] < k["baslangic"]:
                          hata.append(f"{yer}: bitis tarihi baslangictan once")

          # --- duyurular.json ---
          if os.path.exists("duyurular.json"):
              with open("duyurular.json", encoding="utf-8") as f:
                  try:
                      d = json.load(f)
                  except json.JSONDecodeError as e:
                      print(f"HATA: duyurular.json bozuk JSON -> {e}")
                      sys.exit(1)

              KATEGORI = {"DUYURU", "SINAV", "ICERIK", "ACIL"}

              idler2 = set()
              for i, k in enumerate(d.get("duyurular", [])):
                  yer = f"duyurular.json duyuru[{i}] (id={k.get('id','YOK')})"
                  for alan in ("id","baslik","icerik","kategori","tarih"):
                      if not k.get(alan):
                          hata.append(f"{yer}: '{alan}' zorunlu ve bos olamaz")
                  if k.get("id") in idler2:
                      hata.append(f"{yer}: id tekrar ediyor")
                  idler2.add(k.get("id"))
                  if k.get("kategori") not in KATEGORI:
                      hata.append(f"{yer}: kategori '{k.get('kategori')}' gecersiz. Gecerli: {sorted(KATEGORI)}")
                  kontrol_tarih(k.get("tarih"), yer + " tarih")
                  if k.get("baslangic"):
                      kontrol_tarih(k.get("baslangic"), yer + " baslangic")
                  if k.get("bitis"):
                      kontrol_tarih(k.get("bitis"), yer + " bitis")
                      if k.get("baslangic") and k["bitis"] < k["baslangic"]:
                          hata.append(f"{yer}: bitis tarihi baslangictan once")
                  hedef = k.get("hedef") or ""
                  if hedef and not (hedef.startswith("quiz:") or hedef.startswith("web:")):
                      hata.append(f"{yer}: hedef '{hedef}' gecersiz -- 'quiz:ID' veya 'web:URL' ile baslamali")

          # --- diger tum json dosyalari: en azindan sozdizimi ---
          for dosya in glob.glob("*.json"):
              with open(dosya, encoding="utf-8") as f:
                  try:
                      json.load(f)
                  except json.JSONDecodeError as e:
                      hata.append(f"{dosya}: bozuk JSON -> {e}")

          if hata:
              print("\nDOGRULAMA BASARISIZ:\n")
              for h in hata:
                  print("  - " + h)
              print("\nBu degisiklik yayinlanmadi. Yukaridaki hatalari duzeltip tekrar push'la.\n")
              sys.exit(1)

          print("Tum JSON dosyalari gecerli.")
          PY

  cdn-temizle:
    name: jsDelivr onbellegini temizle
    needs: dogrula
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge
        # NOT: @main gibi bir dal (branch) referansının jsDelivr'de ayrı bir
        # çözümleme önbelleği var — dosya bazlı tek bir purge bazen bunu
        # temizlemeye yetmiyor (canlıda gözlemlendi: ilk purge "finished"
        # dönüyor ama CDN birkaç saniye eski veriyi vermeye devam edebiliyor).
        # Bu yüzden her dosyayı iki kez, aralarında kısa bekleyerek purge
        # ediyoruz.
        run: |
          for tur in 1 2; do
            echo "== Purge denemesi $tur/2 =="
            for dosya in *.json; do
              url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${dosya}"
              echo "Temizleniyor: $dosya"
              # jsDelivr "throttled: true" da dönebilir (art arda purge'de
              # normal, zararsız) — bu adımı hiçbir durumda başarısız
              # sayma, sadece bilgi amaçlı logla.
              curl -s -m 30 "$url" || echo "  (purge cevap vermedi, atlandi)"
              echo ""
            done
            if [ "$tur" = "1" ]; then
              sleep 10
            fi
          done
          exit 0
